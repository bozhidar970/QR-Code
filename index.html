<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        background-color: rgb(207, 224, 230);
       
      }

      .container {
        
        background-color: white;
        border-radius: 10px;
        width: 220px;
        height: 360px;
        margin-top: 50px;
        margin-left: 200px;
        
        
        
      }

      img {
        width: 200px;
        border-radius: 10px;
        margin-top: 10px;
        margin-left: 10px;
        
        
      }

      .title {
        text-align: center;
        font-family: Arial;
        font-weight: bold;
        margin-top: 12px;
        margin-bottom: 12px;
       
      }

      .text {
        text-align: center;
        color: gray;

      }

      
    </style>
  </head>
  <body>
    <div class="container">
      <div class="image">
        <img src="image-qr-code.png" alt="QR code">
      </div>
      <div class="title">Improve your front-end skills building projects</div>
      <div class="text">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</div>
    </div>
  </body>
</html>
